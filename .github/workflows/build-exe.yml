name: Build FLEX-Download-Manager for Windows 7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Setup MSVC Developer Command Prompt (makes nmake, cl, link available)
    - name: Setup MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # 2. Install Qt 6
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia qtwebengine'

    # 3. Configure and Build using qmake & nmake for Windows 7 (Subsystem 6.1)
    - name: Build Project for Windows 7
      shell: cmd
      run: |
        cd src
        
        echo Running qmake...
        qmake CONFIG+=release
        
        REM Inject Windows 7 compatibility flags (0x0601) and target subsystem 6.1
        set CL=/DWINVER=0x0601 /D_WIN32_WINNT=0x0601
        set LINK=/SUBSYSTEM:WINDOWS,6.1
        
        echo Building with nmake...
        nmake

    # 4. Bundle Qt DLLs using windeployqt
    - name: Bundle Qt Dependencies
      shell: pwsh
      run: |
        cd src
        $exe = Get-ChildItem -Recurse -Filter "FLEX Download Manager.exe" | Select-Object -First 1
        if ($exe) {
            Write-Host "Deploying dependencies to: $($exe.FullName)"
            windeployqt --release --no-translations $exe.FullName
        }

    # 5. Upload Windows 7 Compatible Executable
    - name: Upload Windows 7 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FLEX-Download-Manager-Win7
        path: |
          src/**/*.exe
          src/**/release/*.exe
          src/release/*.exe
        if-no-files-found: ignore
