name: Build FLEX-Download-Manager for Windows 7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSBuild / Visual Studio
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia qtwebengine'

    - name: Compile Project for Windows 7
      run: |
        # Navigate into the src folder where the project configuration is located
        cd src
        
        Write-Host "Running qmake..."
        qmake
        
        # Configure MSVC environment variables to force Windows 7 (0x0601) compatibility targets
        $env:CL = "/DWINVER=0x0601 /D_WIN32_WINNT=0x0601"
        $env:LINK = "/SUBSYSTEM:WINDOWS,6.1"
        
        Write-Host "Building project with nmake..."
        nmake Release

    - name: Bundle Qt Dependencies (windeployqt)
      run: |
        cd src
        $exe = Get-ChildItem -Recurse -Filter "FLEX Download Manager.exe" | Select-Object -First 1
        if ($exe) {
            Write-Host "Deploying Qt dependencies to: $($exe.FullName)"
            windeployqt --release --no-translations $exe.FullName
        } else {
            Write-Warning "Executable not found automatically, checking release folder..."
        }

    - name: Upload Windows 7 Compatible Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FLEX-Download-Manager-Win7
        path: |
          src/**/*.exe
          src/**/release/*.exe
          src/release/*.exe
        if-no-files-found: ignore
