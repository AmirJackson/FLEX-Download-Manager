name: Build for Windows 7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSBuild / Visual Studio
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia qtwebengine'

    - name: Configure CMake for Windows 7 Target
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_SYSTEM_VERSION=6.1 "-DCMAKE_CXX_FLAGS=/DWINVER=0x0601 /D_WIN32_WINNT=0x0601" "-DCMAKE_EXE_LINKER_FLAGS=/SUBSYSTEM:WINDOWS,6.1" -DCMAKE_BUILD_TYPE=Release

    - name: Build Executable
      run: |
        cmake --build build --config Release

    - name: Bundle Dependencies with windeployqt
      run: |
        $exe = Get-ChildItem -Path build -Recurse -Filter "FLEX Download Manager.exe" | Select-Object -First 1
        if ($exe) {
            Write-Host "Deploying dependencies for: $($exe.FullName)"
            windeployqt --release --no-translations $exe.FullName
        }

    - name: Upload Windows 7 Compatible Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FLEX-Download-Manager-Win7
        path: |
          build/**/*.exe
          build/**/Release/*.exe
        if-no-files-found: ignore
