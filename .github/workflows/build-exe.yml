name: Build FLEX-Download-Manager for Windows 7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Setup MSVC Developer Environment (makes nmake, cl, link globally available)
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # 2. Install Qt
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia qtwebengine'

    # 3. Compile Project for Windows 7
    - name: Compile Project with nmake
      shell: cmd
      run: |
        REM Switch to the source directory using command prompt (cmd)
        cd src
        
        echo Running qmake...
        qmake
        
        REM Set compiler and linker flags for Windows 7 (0x0601 / subsystem 6.1)
        set CL=/DWINVER=0x0601 /D_WIN32_WINNT=0x0601
        set LINK=/SUBSYSTEM:WINDOWS,6.1
        
        echo Building with nmake...
        nmake Release

    # 4. Bundle Qt Dependencies (windeployqt)
    - name: Bundle Qt Dependencies
      shell: pwsh
      run: |
        cd src
        $exe = Get-ChildItem -Recurse -Filter "FLEX Download Manager.exe" | Select-Object -First 1
        if ($exe) {
            Write-Host "Deploying dependencies to: $($exe.FullName)"
            windeployqt --release --no-translations $exe.FullName
        }

    # 5. Upload Windows 7 Compatible Artifact
    - name: Upload Windows 7 Compatible Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FLEX-Download-Manager-Win7
        path: |
          src/**/*.exe
          src/**/release/*.exe
          src/release/*.exe
        if-no-files-found: ignore
