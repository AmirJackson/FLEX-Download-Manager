name: Build FLEX-Download-Manager for Windows 7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSBuild / Visual Studio
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt (Required for UI)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia qtwebengine'

    - name: Compile with Windows 7 Subsystem Targets
      run: |
        # The repository uses a build.bat script. We can run it and pass extra compiler/linker flags
        # targeting Windows 7 (SUBSYSTEM:WINDOWS,6.1)
        
        Write-Host "Running native build.bat..."
        
        # If build.bat exists, invoke it with environment variables enforcing Win7 targets
        $env:CL = "/DWINVER=0x0601 /D_WIN32_WINNT=0x0601"
        $env:LINK = "/SUBSYSTEM:WINDOWS,6.1"
        
        if (Test-Path "build.bat") {
            cmd /c build.bat
        } else {
            Write-Error "build.bat not found in repository root."
            exit 1
        }

    - name: Upload Windows 7 Compatible Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FLEX-Download-Manager-Win7
        path: |
          build/*.exe
          *.exe
        if-no-files-found: ignore
